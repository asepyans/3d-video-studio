name: Import 3D Video Studio Source

on:
  push:
    paths:
      - ".github/workflows/import-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download and import upstream source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://github.com/codewithsiddique-04/3d-video-studio/archive/refs/heads/main.zip -o /tmp/upstream.zip
          mkdir -p /tmp/upstream
          unzip -q /tmp/upstream.zip -d /tmp/upstream
          src="$(find /tmp/upstream -mindepth 1 -maxdepth 1 -type d | head -n1)"
          rsync -a --delete --exclude='.git/' --exclude='.github/' "$src/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source already matches upstream."
          else
            git commit -m "Import 3D Video Studio upstream source"
            git push
          fi
